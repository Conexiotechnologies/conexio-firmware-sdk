CONFIG_LOG=y
CONFIG_PRINTK=y

# I2C bus support
CONFIG_I2C=y

# EEPROM driver (atmel,at24 — auto-enabled via DT, explicit for clarity)
CONFIG_EEPROM=y
CONFIG_EEPROM_AT24=y

CONFIG_MAIN_STACK_SIZE=1536

# Enable MCUboot bootloader support
CONFIG_BOOTLOADER_MCUBOOT=y

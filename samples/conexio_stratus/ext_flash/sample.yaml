sample:
  name: External EEPROM (24CW160) read/write

common:
  tags: eeprom i2c storage

tests:
  samples.ext_flash:
    platform_allow: conexio_stratus_pro_nrf9151_ns
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "EEPROM sample running"
        - "EEPROM size.*2048"
        - "Write.*OK"
        - "Read.*OK"
        - "Verify.*PASSED"

CONFIG_LOG=y
CONFIG_PRINTK=y

# Watchdog timer support
CONFIG_WATCHDOG=y

# GPIO for button interrupt
CONFIG_GPIO=y

# Thread stack size for the watchdog feed thread
CONFIG_MAIN_STACK_SIZE=2048

# Enable Zephyr application to be booted by MCUboot
CONFIG_BOOTLOADER_MCUBOOT=y

CONFIG_LOG=y
CONFIG_PRINTK=y

# Counter API (Zephyr's RTC abstraction)
CONFIG_COUNTER=y

# System power-off support (for wake-from-system-off demo)
CONFIG_POWEROFF=y

# Power management (required for sys_poweroff on nRF9151)
CONFIG_PM=y

# Enable Zephyr application to be booted by MCUboot
CONFIG_BOOTLOADER_MCUBOOT=y

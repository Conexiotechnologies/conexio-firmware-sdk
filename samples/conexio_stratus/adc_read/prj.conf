CONFIG_LOG=y
CONFIG_PRINTK=y

# ADC support
CONFIG_ADC=y

# Float printf support for displaying mV values
CONFIG_REQUIRES_FLOAT_PRINTF=y

# Enable Zephyr application to be booted by MCUboot
CONFIG_BOOTLOADER_MCUBOOT=y
